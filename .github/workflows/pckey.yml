name: Build PCKey Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pckey.zip
      - .github/workflows/pckey.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q pckey.zip -d pckey

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle -p pckey assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=$(ls pckey/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: pckey-release
          path: pckey/app/build/outputs/apk/release/*.apk
