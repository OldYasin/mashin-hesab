name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle + dependency cache (this is the biggest speed-up; first run is cold, next runs are fast)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Locate ScriptTunnel project
        run: |
          if ! find . -name settings.gradle.kts -not -path './.git/*' | grep -q .; then
            z=$(ls ./*.zip 2>/dev/null | head -n1)
            if [ -n "$z" ]; then
              echo "Unzipping $z"
              unzip -q -o "$z" -d project-src
            fi
          fi
          f=$(find . -name settings.gradle.kts -not -path './.git/*' -not -path '*/build/*' | head -n1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi
          ROOT="$(cd "$(dirname "$f")" && pwd)"
          [ -f "$ROOT/app/build.gradle.kts" ] || { echo "::error::app/build.gradle.kts missing"; exit 1; }
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - signing with a throwaway CI key"
            KS_PASS="ci-temp-pass"; KEY_PASS="ci-temp-pass"; KS_ALIAS="upload"
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ScriptTunnel CI" 2>/dev/null
          fi
          {
            echo "KEYSTORE_PATH=$KS"
            echo "STORE_PASSWORD=$KS_PASS"
            echo "KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            echo "KEY_ALIAS=${KS_ALIAS:-upload}"
          } >> "$GITHUB_ENV"

      # -PfastBuild: no R8/shrink. No --refresh-dependencies, no cache wipe, daemon allowed.
      - name: Build release APK
        run: gradle -p "$ROOT" assembleRelease -PfastBuild --parallel --build-cache --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: scripttunnel-release-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/release/*.apk
          compression-level: 0
