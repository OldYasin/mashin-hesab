name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Locate ScriptTunnel project
        run: |
          set +e
          find_settings() { find . -name settings.gradle.kts -not -path './.git/*' -not -path '*/build/*' 2>/dev/null | head -n1; }
          f="$(find_settings)"
          if [ -z "$f" ]; then
            for z in $(find . -iname '*.zip' -not -path './.git/*' -not -path './project-src/*' 2>/dev/null); do
              echo "Unzipping $z"
              unzip -q -o "$z" -d project-src
            done
            f="$(find_settings)"
          fi
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found. Repo tree (depth 3):"
            find . -maxdepth 3 -not -path './.git/*' | head -80
            exit 1
          fi
          ROOT="$(cd "$(dirname "$f")" && pwd)"
          if [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts missing in $ROOT"
            ls -la "$ROOT"
            exit 1
          fi
          echo "Gradle root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build dnstt-client native binary (libdnstt.so)
        run: |
          git clone https://www.bamsoftware.com/git/dnstt.git "$RUNNER_TEMP/dnstt"
          mkdir -p "$ROOT/app/src/main/jniLibs/arm64-v8a" "$ROOT/app/src/main/jniLibs/armeabi-v7a"
          cd "$RUNNER_TEMP/dnstt/dnstt-client"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o "$ROOT/app/src/main/jniLibs/arm64-v8a/libdnstt.so" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" \
            -o "$ROOT/app/src/main/jniLibs/armeabi-v7a/libdnstt.so" .
          # Ensure Android 10+ extracts libdnstt.so to nativeLibraryDir so ProcessBuilder can execute it
          if ! grep -q "useLegacyPackaging" "$ROOT/app/build.gradle.kts"; then
            python3 - "$ROOT/app/build.gradle.kts" << 'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          txt = p.read_text(encoding="utf-8")
          if "packaging {" in txt:
              txt = txt.replace("packaging {", "packaging {\n        jniLibs { useLegacyPackaging = true }", 1)
          elif "android {" in txt:
              txt = txt.replace("android {", "android {\n    packaging { jniLibs { useLegacyPackaging = true } }", 1)
          p.write_text(txt, encoding="utf-8")
          PY
          fi

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - signing with a throwaway CI key"
            KS_PASS="ci-temp-pass"; KEY_PASS="ci-temp-pass"; KS_ALIAS="upload"
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ScriptTunnel CI" 2>/dev/null
          fi
          {
            echo "KEYSTORE_PATH=$KS"
            echo "STORE_PASSWORD=$KS_PASS"
            echo "KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            echo "KEY_ALIAS=${KS_ALIAS:-upload}"
          } >> "$GITHUB_ENV"

      - name: Build release APK (R8 Minify + ShrinkResources)
        run: gradle -p "$ROOT" assembleRelease --parallel --build-cache --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: scripttunnel-release-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/release/*.apk
          compression-level: 0
